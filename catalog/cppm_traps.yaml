    title_tpl: "[CPPM][INFO] Service '{{vb.cppmServiceName}}' restarted on {{node.name}}"

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1021"
    name: cppmHighCPULoadNotification
    category: AAA/NAC
    alarm_type: Resource Threshold
    severity: medium
    create_ticket: true
    title_tpl: "[CPPM][MEDIUM] High CPU load on {{node.name}}: {{vb.cppmCPUAverageLoad}}"
    recommended_action: "Check auth rate spike, Insight/report jobs, and per-service CPU in System Monitor."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1022"
