    category: AAA/NAC
    alarm_type: Replication Failure
    severity: high
    create_ticket: true
    dedup_field: cppmClusterServerIp
    title_tpl: "[CPPM][HIGH] Cluster node {{vb.cppmClusterServerIp}} out of sync for {{vb.cppmClusterOutOfSyncMinutes}} min"
    recommended_action: "Check publisher<->subscriber reachability (TCP 443/5432), time sync, and replication status in Server Manager."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1011"
