    category: AAA/NAC
    alarm_type: Cluster Event
    severity: info
    create_ticket: false
    title_tpl: "[CPPM][INFO] Node {{vb.cppmClusterServerIp}} added to cluster"

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1007"
    name: cppmClusterNodeDelNotification
    category: AAA/NAC
    alarm_type: Cluster Event
    severity: high
    create_ticket: true
    title_tpl: "[CPPM][HIGH] Node {{vb.cppmClusterServerIp}} removed from cluster"
    recommended_action: "Confirm the removal was planned (change record). If not, investigate immediately."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1008"
    name: cppmClusterNodePromNotification
    category: AAA/NAC
    alarm_type: Cluster Event
    severity: high
    create_ticket: true
    title_tpl: "[CPPM][HIGH] Node {{vb.cppmClusterServerIp}} promoted to Publisher"
    recommended_action: "Verify publisher failover cause; check original publisher health and standby publisher config."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1009"
    name: cppmClusterNodeDbldNotification
    category: AAA/NAC
    alarm_type: Cluster Event
    severity: high
    create_ticket: true
    title_tpl: "[CPPM][HIGH] Cluster node {{vb.cppmClusterServerIp}} disabled"
    recommended_action: "Check why the node was disabled and whether NADs still point to it."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1010"
