  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1023"
    name: cppmClusterLicenseOverrun
    category: AAA/NAC
    alarm_type: License Alert
    severity: high
    create_ticket: true
    dedup_field: cppmLicenseApplicationName
    title_tpl: "[CPPM][HIGH] License overrun for {{vb.cppmLicenseApplicationName}} ({{vb.cppmLicenseOverrunDailyCount}} times today)"
    recommended_action: "Add licenses or reduce consumption; overrun may block new authentications per licensing policy."

  # Standard SNMPv2 traps
  - oid: "1.3.6.1.6.3.1.1.5.1"
    name: coldStart
    category: AAA/NAC
    alarm_type: System Event
    severity: high
    create_ticket: true
    title_tpl: "[CPPM][HIGH] Reboot detected (coldStart) on {{node.name}}"
    recommended_action: "Confirm planned vs unplanned reboot; verify all services are running after boot."

  - oid: "1.3.6.1.6.3.1.1.5.2"
    name: warmStart
    category: AAA/NAC
    alarm_type: System Event
    severity: medium
    create_ticket: true
    title_tpl: "[CPPM][MEDIUM] SNMP agent restart (warmStart) on {{node.name}}"

  # ---------------------------------------------------------------------------
  # CPPM built-in watchdog: net-snmp DISMAN-EVENT-MIB triggers on UCD extTable /
  # memory / disk / load / process checks. Pushed by CPPM (no polling needed).
  # Observed on CPPM 6.14.1 (2026-11-17): ~20 checks incl. radius, tacacs, policy,
  # dbcn, dbwrite, replication, postgresql, httpd, and the per-AD-domain
  # "Domain Server [ cpass-domain-server@<DOMAIN>.service ]".
  # Rising/Falling direction is NOT reliable on its own: the engine classifies each
  # trap by mteHotValue + extOutput text ("is stopped|inactive|dead|failed" = failing,
  # "is running|active (running)" = OK). Failing → service.down alert (same key as
  # trap 1017 and the REST service poll); OK → clears it.
  - oid: "1.3.6.1.2.1.88.2.0.1"
    name: mteTriggerFired
    category: AAA/NAC
    alarm_type: Service Health (CPPM watchdog)
    severity: medium
    create_ticket: true
    dedup_field: extNames
    title_tpl: "{{vb.extOutput}}"
    recommended_action: "Check the service in Administration > Server Manager > Server Configuration > Services Control; start it if stopped; check Event Viewer"

  - oid: "1.3.6.1.2.1.88.2.0.2"
    name: mteTriggerRising
    category: AAA/NAC
    alarm_type: Service Health (CPPM watchdog)
    severity: medium
    create_ticket: true
    dedup_field: extNames
    title_tpl: "{{vb.extOutput}}"
    recommended_action: "Check the service in Administration > Server Manager > Server Configuration > Services Control; start it if stopped; check Event Viewer"

  - oid: "1.3.6.1.2.1.88.2.0.3"
    name: mteTriggerFalling
    category: AAA/NAC
    alarm_type: Service Health (CPPM watchdog)
    severity: medium
    create_ticket: true
    dedup_field: extNames
    title_tpl: "{{vb.extOutput}}"
    recommended_action: "Check the service in Administration > Server Manager > Server Configuration > Services Control; start it if stopped; check Event Viewer"

  # Link traps carry only ifIndex (no ifDescr) on CPPM; the one seen was docker0.
  # Log-only (visible in Live Traps); the poller's interface errors cover real NIC problems.
  - oid: "1.3.6.1.6.3.1.1.5.3"
    name: linkDown
    category: AAA/NAC
    alarm_type: Interface Event
    severity: low
    create_ticket: false
    dedup_field: ifIndex
    clear_oid: ["1.3.6.1.6.3.1.1.5.4"]
    clear_match_field: ifIndex
    title_tpl: "[CPPM][LOW] Interface ifIndex {{vb.ifIndex}} down on {{node.name}}"

  - oid: "1.3.6.1.6.3.1.1.5.4"
    name: linkUp
    category: AAA/NAC
    alarm_type: Interface Event
    severity: info
    create_ticket: false
    title_tpl: "[CPPM][INFO] Interface ifIndex {{vb.ifIndex}} up on {{node.name}}"

  # net-snmp agent lifecycle (log-only; a real reboot is caught by coldStart + uptime)
  - oid: "1.3.6.1.4.1.8072.4.0.1"
    name: nsNotifyStart
    category: AAA/NAC
    alarm_type: System Event
    severity: info
    create_ticket: false
    title_tpl: "[CPPM][INFO] SNMP agent started on {{node.name}}"

  - oid: "1.3.6.1.4.1.8072.4.0.2"
    name: nsNotifyShutdown
    category: AAA/NAC
    alarm_type: System Event
    severity: info
    create_ticket: false
    title_tpl: "[CPPM][INFO] SNMP agent shutting down on {{node.name}}"

  - oid: "1.3.6.1.4.1.8072.4.0.3"
    name: nsNotifyRestart
    category: AAA/NAC
    alarm_type: System Event
    severity: info
    create_ticket: false
    title_tpl: "[CPPM][INFO] SNMP agent restarted on {{node.name}}"
