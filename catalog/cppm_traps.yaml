    severity: high              # engine downgrades to medium for non-critical services
    create_ticket: true
    dedup_field: cppmServiceName
    clear_oid: ["1.3.6.1.4.1.14823.1.6.1.1.200.1018", "1.3.6.1.4.1.14823.1.6.1.1.200.1019"]
    clear_match_field: cppmServiceName
    title_tpl: "[CPPM][HIGH] Service '{{vb.cppmServiceName}}' stopped on {{node.name}}"
    recommended_action: "Administration > Server Manager > Server Configuration > Services Control: check and start the service; review Event Viewer."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1018"
    name: cppmServiceStartNotification
    category: AAA/NAC
    alarm_type: Application Event
    severity: info
    create_ticket: false
    is_clear: true
    title_tpl: "[CPPM][INFO] Service '{{vb.cppmServiceName}}' started on {{node.name}}"

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1019"
