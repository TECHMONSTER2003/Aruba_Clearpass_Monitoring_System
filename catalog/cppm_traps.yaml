traps:
  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1001"
    name: cppmLicenseExpiry
    category: AAA/NAC
    alarm_type: License Alert
    severity: medium
    create_ticket: true
    title_tpl: "[CPPM][MEDIUM] {{vb.cppmNodeApplicationName}} license expires in {{vb.cppmLicenseDaysRemaining}} days on {{node.name}}"
    recommended_action: "Renew/re-apply the license under Administration > Server Manager > Licensing."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1002"
    name: cppmActivationExpiry
    category: AAA/NAC
    alarm_type: License Alert
    severity: medium
    create_ticket: true
    title_tpl: "[CPPM][MEDIUM] {{vb.cppmNodeApplicationName}} activation expires in {{vb.cppmActivationDaysRemaining}} days on {{node.name}}"
    recommended_action: "Activate the license online/offline before expiry."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1003"
    name: cppmNodeCertExpiry
    category: AAA/NAC
    alarm_type: Security Alert
    severity: medium          # engine escalates to high when cppmCertDaysRemaining <= 7
    create_ticket: true
    dedup_field: cppmNodeCertApplicationName
    title_tpl: "[CPPM][CERT] {{vb.cppmNodeCertApplicationName}} certificate expires in {{vb.cppmCertDaysRemaining}} days on {{node.name}}"
    recommended_action: "Renew the server certificate (HTTPS/RADIUS/RadSec) and update trust on NADs/supplicants if the CA changes."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1004"
    name: cppmLowDiskSpace
    category: AAA/NAC
    alarm_type: Storage Threshold
    severity: medium
    create_ticket: true
    title_tpl: "[CPPM][MEDIUM] Low disk space on {{node.name}}: {{vb.cppmDiskSpaceRemaining}} {{vb.cppmResourceUnit}} remaining"
    recommended_action: "Run log cleanup (Cleanup Intervals), review Insight DB size and Access Tracker retention."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1005"
    name: cppmLowMemory
    category: AAA/NAC
    alarm_type: Resource Threshold
    severity: medium
    create_ticket: true
    title_tpl: "[CPPM][MEDIUM] Low memory on {{node.name}}: {{vb.cppmMemoryRemaining}} {{vb.cppmResourceUnit}} remaining"
    recommended_action: "Check System Monitor for the consuming service; plan a restart in a maintenance window if the leak persists."

  - oid: "1.3.6.1.4.1.14823.1.6.1.1.200.1006"
